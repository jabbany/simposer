<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16181c" />
    <meta name="description" content="Pose 3D figures with natural language for drawing reference." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Simposer</title>
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <div id="hud">
        <!-- shown in both modes, but only transiently -->
        <div id="crosshair" aria-hidden="true"></div>
        <div id="aim-label" aria-live="polite"></div>
        <div id="status" role="status" aria-live="polite"></div>
        <div id="flash" aria-hidden="true"></div>

        <!-- interact mode only (mouse free) -->
        <div id="interact" class="interact-only">
          <section id="target-frame" class="hud-box" aria-label="Selected figure"></section>

          <section id="rig" class="hud-box" aria-label="Camera rig">
            <header class="rig-head">
              <span class="rig-title">Camera</span>
              <span id="rig-shot"></span>
            </header>
            <canvas id="rig-plan" aria-label="Top view of the camera and scene"></canvas>
            <canvas id="rig-side" aria-label="Side view of the camera height and tilt"></canvas>
            <div id="rig-readout"></div>
          </section>

          <section id="chat" class="hud-box" aria-label="Describe changes">
            <div id="chat-log" aria-label="Change history"></div>
            <div class="chat-row">
              <textarea id="prompt" rows="1" placeholder="Describe the scene or a change, then press Enter"></textarea>
              <button id="send" class="primary">Send</button>
            </div>
            <div class="chat-tools">
              <button id="undo" class="small" title="Undo (Ctrl+Z)">Undo</button>
              <button id="redo" class="small" title="Redo (Ctrl+Shift+Z)">Redo</button>
              <button id="history-btn" class="small" title="Show the full change history">History</button>
              <span id="provider-label" class="muted"></span>
            </div>
          </section>

          <div id="bottom-center">
            <div id="actionbar" aria-label="Actions"></div>
            <div id="hints"></div>
          </div>

          <div id="top-right-tools">
            <button id="snapshot" class="primary" title="Save the framed view as an image (P)">Snapshot <kbd>P</kbd></button>
            <button id="look-btn" title="Capture the mouse and look around (or click the scene)">Look <kbd>Click</kbd></button>
            <button id="help-btn" title="Keyboard and mouse controls (H)">Help <kbd>H</kbd></button>
          </div>

          <section id="help" class="hud-box hidden" aria-label="Controls"></section>

          <section id="window" class="hud-window hidden" aria-label="Panel">
            <header>
              <nav id="tabs" role="tablist">
                <button role="tab" data-tab="figure">Figure <kbd>C</kbd></button>
                <button role="tab" data-tab="camera">Camera <kbd>V</kbd></button>
                <button role="tab" data-tab="scene">Script <kbd>J</kbd></button>
                <button role="tab" data-tab="settings">Settings <kbd>O</kbd></button>
              </nav>
              <button id="window-close" class="small" title="Close (Esc)">Close</button>
            </header>
            <div id="panel"></div>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
